services:
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
      STATE_DIR: /app/state
    volumes:
      - state:/app/state
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mlflow:
    build: .
    command: mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////app/state/mlflow.db
    ports:
      - "5000:5000"
    environment:
      STATE_DIR: /app/state
    volumes:
      - state:/app/state

volumes:
  state: